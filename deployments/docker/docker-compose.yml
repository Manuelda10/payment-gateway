version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: payment_gateway_postgres
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_gateway
      POSTGRES_PASSWORD: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: